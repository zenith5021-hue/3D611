<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>계절의 변화 3D 책</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&display=swap">
<style>
/* 개념: 책상 위 매트에 펼쳐 둔 하드커버 책. 글은 책장에 인쇄되고, 오른쪽 쪽에서 잉크 그림이 솟아오르며 에너지는 빛나는 통에 담긴다. */
:root{
  color-scheme: light;
  --desk:#d8cfbf; --ink:#1d2233; --ink-soft:#5b6072; --red:#b23a2e;
  --glass:rgba(252,250,245,.72); --glass-line:rgba(255,255,255,.75);
  --paper:#fbf9f3; --paper-2:#f1ead9;
  --pot:#8a4dff; --kin:#1f7bff; --heat:#ff7a1a; --light:#f2b400; --elec:#14a3a0;
  --serif:"Gowun Batang","Nanum Myeongjo","Apple SD Gothic Neo",serif;
  --hand:"Nanum Pen Script","Gowun Batang",cursive;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--desk);color:var(--ink);overflow:hidden}
body{font-family:var(--serif);padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:0}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.2);backdrop-filter:blur(18px) saturate(1.2);
  border:1px solid var(--glass-line);box-shadow:0 12px 32px -14px rgba(40,34,22,.45),inset 0 1px 0 rgba(255,255,255,.85)}

.chip{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);left:max(16px, env(safe-area-inset-left, 0px));
  border-radius:999px;padding:7px 16px 7px 12px;display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.chip i{width:14px;height:14px;border-radius:3px;background:linear-gradient(135deg,#f2b33d 50%,#3f7f8f 50%);display:block}

.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 16px);
  border-radius:999px;display:flex;align-items:center;gap:2px;padding:6px 10px;max-width:calc(100% - 32px);width:720px}
.bar button{background:none;border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.bar button:hover{background:rgba(29,34,51,.07)}
.bar .vb[aria-pressed="true"]{background:var(--ink)} .bar .vb[aria-pressed="true"] svg{stroke:#fbf9f3}
.bar svg{width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.cap{flex:1;min-width:0;display:flex;align-items:center;gap:8px;padding:0 6px;font-size:15px;line-height:1.25}
.cap .no{color:var(--red);font-weight:700;flex:none}
.cap .tx{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.steps{display:flex;gap:5px;flex:none;padding-right:6px}
.steps button{width:8px;height:8px;border-radius:99px;background:rgba(29,34,51,.25);padding:0}
.steps button.on{width:22px;background:var(--ink)}
.sep{width:1px;height:24px;background:rgba(29,34,51,.15);margin:0 4px;flex:none}

.panel{position:fixed;border-radius:18px;padding:18px 20px;max-height:calc(100% - 140px);overflow:auto;width:min(380px, calc(100% - 32px))}
#menu{left:max(16px, env(safe-area-inset-left, 0px));top:calc(env(safe-area-inset-top, 0px) + 64px)}
#teach{right:max(16px, env(safe-area-inset-right, 0px));top:calc(env(safe-area-inset-top, 0px) + 64px);width:min(440px, calc(100% - 32px))}
.panel h2{font-size:22px;margin:2px 0 10px;text-wrap:balance}
.panel h3{font-size:16px;margin:16px 0 4px}
.panel p,.panel li{font-size:14.5px;line-height:1.7;margin:4px 0}
.panel ul{padding-left:1.1em;margin:4px 0}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--red);font-weight:700;margin:0}
.toc{list-style:none;margin:6px 0 0;padding:0}
.toc button{width:100%;text-align:left;background:none;border:0;border-top:1px solid rgba(29,34,51,.12);padding:12px 2px;display:grid;grid-template-columns:2.6em 1fr auto;gap:6px;align-items:baseline}
.toc button:hover .tt{text-decoration:underline}
.toc .n{color:var(--red);font-weight:700}
.toc .tt{font-size:17px}
.toc .st{font-size:12px;color:var(--ink-soft)}
.toc button[aria-current="true"] .tt{font-weight:700}
.x{position:absolute;top:10px;right:10px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(29,34,51,.06)}
.lnk{background:none;border:1px solid rgba(29,34,51,.25);border-radius:999px;padding:6px 14px;font-size:13px;margin-top:10px}

#flap{position:fixed;top:50%;transform:translateY(-50%);left:max(16px, calc(26% - 230px));width:min(460px, calc(100% - 32px));
  border-radius:16px;padding:22px 24px;max-height:calc(100% - 150px);overflow:auto;background:rgba(253,252,248,.94)}
#flap .verdict{font-size:17px;font-weight:700;margin:6px 0 10px}
#flap .good{color:#2b7a4b} #flap .miss{color:var(--red)}
#flap p{font-size:15.5px;line-height:1.75;margin:8px 0}
.formula{font-size:15px;background:var(--paper-2);border-left:3px solid var(--ink);padding:8px 12px;margin:10px 0;overflow-x:auto;white-space:nowrap;font-style:italic}
.small{font-size:13px!important;color:var(--ink-soft)}
.chal{border-top:1px dashed rgba(29,34,51,.25);margin-top:14px;padding-top:10px}
.chal .hand{font-family:var(--hand);font-size:22px;line-height:1.3}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.row input{width:120px;font:inherit;font-size:16px;padding:6px 10px;border:1px solid rgba(29,34,51,.35);border-radius:8px;background:#fff}
.btn{border:1px solid var(--ink);background:var(--ink);color:#fbf9f3;border-radius:999px;padding:6px 16px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);font-size:15px;padding:6px 18px}
.note{font-size:14px;min-height:1.4em;color:var(--ink-soft)}

#hud{position:fixed;top:calc(env(safe-area-inset-top, 0px) + 14px);right:max(16px, env(safe-area-inset-right, 0px));width:min(270px, calc(100% - 32px));border-radius:16px;padding:10px 14px 12px}
.hud-h{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.hud-h button{border:1px solid rgba(29,34,51,.2);background:none;border-radius:999px;font-size:12px;padding:2px 10px}
#hudB h4{margin:10px 0 4px;font-size:11.5px;letter-spacing:.12em;color:var(--red)}
.hr{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:14.5px;line-height:1.55;border-top:1px solid rgba(29,34,51,.08)}
.hr span{color:var(--ink-soft);display:inline-flex;align-items:center;gap:6px}
.hr i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hr b{font-variant-numeric:tabular-nums;font-size:16.5px;white-space:nowrap}
.hr.sum{border-top:1.5px solid rgba(29,34,51,.35)}
.seg{display:inline-flex;gap:4px;align-items:center}
.seg b{min-width:52px;text-align:center}
.seg button,.hbtns button{border:1px solid rgba(29,34,51,.3);background:rgba(255,255,255,.55);border-radius:999px;min-width:30px;height:28px;font-size:13px;padding:0 10px}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fbf9f3;border-color:var(--ink)}
.hbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.hbtns button{flex:1 0 auto;height:32px;font-size:14px;white-space:nowrap}
.hbtns button.pri{background:var(--ink);color:#fbf9f3;border-color:var(--ink)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom, 0px) + 82px);border-radius:999px;padding:8px 16px;font-size:14px;transition:opacity .6s;pointer-events:none;white-space:nowrap;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis}
#loading{position:fixed;inset:0;display:grid;place-items:center;font-size:18px;color:var(--ink-soft);background:var(--desk);transition:opacity .6s}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@media (max-width:640px){ .bar{padding:6px 6px} .bar button{width:36px;height:36px} .cap .tx{-webkit-line-clamp:1} }
@media (max-width:560px){ #hud{top:auto;bottom:calc(env(safe-area-inset-bottom, 0px) + 84px);width:210px}  .steps{display:none} .cap{font-size:14px} #flap{left:50%;transform:translate(-50%,-50%)} }
@media (prefers-reduced-motion: reduce){ #toast,#loading{transition:none} }
</style>

<canvas id="c" tabindex="0" aria-label="펼친 3D 책. 끌어서 돌리고 휠이나 두 손가락으로 확대합니다."></canvas>
<div id="loading">책을 펼치는 중…</div>
<div class="chip glass"><i></i>계절의 변화</div>

<div class="bar glass" role="toolbar" aria-label="책 넘기기">
  <button id="bMenu" aria-label="차례"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h11"/></svg></button>
  <button id="bPrev" aria-label="앞 장"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <button id="bPlay" aria-label="장면 따라가기"><svg viewBox="0 0 24 24" id="playIco"><path d="M8 5l11 7-11 7z" style="fill:var(--ink);stroke:none"/></svg></button>
  <div class="cap"><span class="no" id="capNo">1</span><span class="tx" id="capTx"></span></div>
  <div class="steps" id="steps"></div>
  <button id="bNext" aria-label="다음 장"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  <span class="sep"></span>
  <button id="bRead" class="vb" aria-pressed="false" aria-label="글 읽기 시점" title="글 읽기 (왼쪽 쪽 더블클릭, R)"><svg viewBox="0 0 24 24"><path d="M3 5.5c3-1 6-1 9 1 3-2 6-2 9-1V19c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6.5V20"/></svg></button>
  <button id="bExp" class="vb" aria-pressed="false" aria-label="실험 보기" title="실험 보기 (오른쪽 그림 더블클릭, E)"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6.5L4.6 18.2A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.8L14 9.5V3"/><path d="M7.5 15h9"/></svg></button>
  <button id="bPan" class="vb" aria-pressed="false" aria-label="끌어서 화면 옮기기" title="켜면 끌 때 화면이 옮겨집니다 (Shift+끌기도 됩니다)"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3 9.5 5.5M12 3l2.5 2.5M12 21l-2.5-2.5M12 21l2.5-2.5M3 12l2.5-2.5M3 12l2.5 2.5M21 12l-2.5-2.5M21 12l-2.5 2.5"/></svg></button>
  <button id="bTeach" aria-label="교사용 메모"><svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2.5 9 2.5 12 0v-5"/><path d="M22 9v6"/></svg></button>
</div>

<section id="hud" class="glass" aria-label="실험 값"><div class="hud-h"><b>실험 값</b><button id="hudT" aria-expanded="true" aria-label="실험 값 접기">접기</button></div><div id="hudB"></div></section>
<section id="menu" class="panel glass" hidden aria-label="차례"></section>
<section id="teach" class="panel glass" hidden aria-label="교사용 메모"></section>
<section id="flap" class="glass" hidden aria-live="polite"></section>
<div id="toast" class="glass" style="opacity:0"></div>
<div class="sr" id="sr" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const G = 9.8, PI = Math.PI;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const easeBack = t => { const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const f2 = v => (Math.abs(v) < 5e-4 ? 0 : v).toFixed(2);
const COL = { ink: 0x1d2233, paper: 0xfbf9f3, pot: 0x8a4dff, kin: 0x1f7bff, heat: 0xff7a1a, light: 0xf5b800, elec: 0x14a3a0 };
const INK = '#1d2233', SOFT = '#5b6072', RED = '#b23a2e', HANDC = '#2b3763';
const SERIF = '"Gowun Batang", "Nanum Myeongjo", serif', HAND = '"Nanum Pen Script", "Gowun Batang", cursive';

/* ---------- 저장 ---------- */
const KEY = 'seasons-book-3d-v1';
let prog = { ch1: {}, ch2: {}, ch3: {}, ch4: {} };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) prog = Object.assign(prog, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(prog)); } catch (e) {} };

/* ---------- 렌더러 ---------- */
const canvas = $('#c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { $('#loading').textContent = '이 브라우저에서는 3D 그림을 그릴 수 없습니다. 그래픽 가속을 켜거나 다른 브라우저로 열어 주세요.'; return; }
const DPR = Math.min(devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const ANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene(); scene.background = new THREE.Color(0xd6ccbb);
const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.05, 80);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = .08; controls.minDistance = .9; controls.maxDistance = 11;
controls.maxPolarAngle = 1.32; controls.screenSpacePanning = true; controls.rotateSpeed = .7;

scene.add(new THREE.HemisphereLight(0xffffff, 0xcabfae, .84));
const sun = new THREE.DirectionalLight(0xfff3e2, .34);
sun.position.set(-4.5, 8, -3.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -5, right: 5, top: 5, bottom: -5, near: 1, far: 22 });
sun.shadow.bias = -0.0006; sun.shadow.radius = 4; scene.add(sun);
/* ---------- 텍스처 ---------- */
const mkCanvas = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
const tex = c => { const t = new THREE.CanvasTexture(c); t.anisotropy = ANISO; return t; };
function noiseFill(g, w, h, base, amt, n) { g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) { g.fillStyle = `rgba(${Math.random() < .5 ? '255,255,255' : '60,50,40'},${Math.random() * amt})`; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); } }
const woodTex = (() => { const c = mkCanvas(1024, 1024), g = c.getContext('2d'); g.fillStyle = '#ddd3c2'; g.fillRect(0, 0, 1024, 1024);
  for (let i = 0; i < 260; i++) { const y = Math.random() * 1024, a = Math.random() * .09, w = 1 + Math.random() * 4;
    g.strokeStyle = Math.random() < .55 ? `rgba(120,95,65,${a})` : `rgba(255,250,240,${a * 1.4})`; g.lineWidth = w; g.beginPath();
    for (let x = 0; x <= 1024; x += 32) g.lineTo(x, y + Math.sin(x / 140 + i) * 3); g.stroke(); }
  const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(2.4, 2.4); return t; })();
const matTex = (() => { const c = mkCanvas(512, 512), g = c.getContext('2d'); noiseFill(g, 512, 512, '#a9b9b1', .12, 26000);
  const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(4, 3); return t; })();
const hatchCanvas = (() => { const c = mkCanvas(128, 128), g = c.getContext('2d'); g.fillStyle = '#fbf9f3'; g.fillRect(0, 0, 128, 128);
  g.strokeStyle = 'rgba(29,34,51,.78)'; g.lineWidth = 2.2; for (let i = -128; i < 256; i += 14) { g.beginPath(); g.moveTo(i, 128); g.lineTo(i + 128, 0); g.stroke(); } return c; })();
const stripeCanvas = (() => { const c = mkCanvas(256, 128), g = c.getContext('2d'); g.fillStyle = '#fbf9f3'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = 'rgba(29,34,51,.42)'; g.lineWidth = 1.6; for (let y = 6; y < 128; y += 11) { g.beginPath(); g.moveTo(0, y); g.lineTo(256, y); g.stroke(); } return c; })();
const meridianCanvas = (() => { const c = mkCanvas(256, 128), g = c.getContext('2d'); g.fillStyle = '#fbf9f3'; g.fillRect(0, 0, 256, 128);
  g.strokeStyle = 'rgba(29,34,51,.55)'; g.lineWidth = 1.6; for (let x = 4; x < 256; x += 13) { g.beginPath(); g.moveTo(x, 0); g.lineTo(x, 128); g.stroke(); } return c; })();
const blockCanvas = (() => { const c = mkCanvas(16, 256), g = c.getContext('2d'); g.fillStyle = '#f3efe4'; g.fillRect(0, 0, 16, 256);
  g.fillStyle = 'rgba(120,110,90,.25)'; for (let y = 0; y < 256; y += 5) g.fillRect(0, y, 16, 1); return c; })();
const dotTex = (() => { const c = mkCanvas(64, 64), g = c.getContext('2d'), r = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  r.addColorStop(0, 'rgba(255,255,255,1)'); r.addColorStop(.4, 'rgba(255,255,255,.8)'); r.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0, 0, 64, 64); return new THREE.CanvasTexture(c); })();
function repTex(c, rx, ry) { const t = tex(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rx, ry); return t; }

/* ---------- 재질과 잉크 ---------- */
const MAT = {
  paper: new THREE.MeshLambertMaterial({ color: COL.paper }),
  inkBack: new THREE.MeshBasicMaterial({ color: COL.ink, side: THREE.BackSide }),
};
const lineMats = [];
function LM(color, w, extra = {}) { const m = new THREE.LineMaterial(Object.assign({ color, linewidth: w }, extra)); m.resolution.set(innerWidth, innerHeight); lineMats.push(m); return m; }
const L = { ink: LM(COL.ink, 1.9), thin: LM(COL.ink, 1.2), dash: LM(COL.ink, 1.4, { dashed: true, dashSize: .035, gapSize: .025 }), dashK: LM(COL.heat, 1.6, { dashed: true, dashSize: .03, gapSize: .02 }) };
function fatSeg(arr, mat = L.ink) { const g = new THREE.LineSegmentsGeometry(); g.setPositions(arr); const l = new THREE.LineSegments2(g, mat); if (mat.dashed) l.computeLineDistances(); return l; }
function fatPoly(pts, mat = L.ink) { const a = []; for (let i = 0; i < pts.length - 1; i++) a.push(pts[i].x, pts[i].y, pts[i].z, pts[i + 1].x, pts[i + 1].y, pts[i + 1].z); return fatSeg(a, mat); }
function fatEdges(geo, mat = L.ink, th = 20) { const e = new THREE.EdgesGeometry(geo, th); const a = Array.from(e.attributes.position.array); e.dispose(); return fatSeg(a, mat); }
function hatchMat(rx, ry) { return new THREE.MeshLambertMaterial({ map: repTex(hatchCanvas, Math.max(1, rx), Math.max(1, ry)) }); }
function shadowed(m) { m.castShadow = true; m.receiveShadow = true; return m; }
function inkBox(w, h, d, hatch = true) {
  const geo = new THREE.BoxGeometry(w, h, d), t = .09;
  const mats = hatch ? [hatchMat(d / t, h / t), hatchMat(d / t, h / t), MAT.paper, MAT.paper, hatchMat(w / t, h / t), hatchMat(w / t, h / t)] : MAT.paper;
  const g = new THREE.Group(); g.add(shadowed(new THREE.Mesh(geo, mats)), fatEdges(geo)); return g;
}
function hull(mesh, k, ky = k) { const h = new THREE.Mesh(mesh.geometry, MAT.inkBack); h.scale.set(k, ky, k); mesh.add(h); return h; }
function circlePts(r, y = 0, n = 48) { return Array.from({ length: n + 1 }, (_, i) => new THREE.Vector3(Math.cos(i / n * PI * 2) * r, y, Math.sin(i / n * PI * 2) * r)); }
const dotMats = {};

  syncViewBtns(); toast(on ? '이동 켬: 끌면 화면이 옮겨집니다.' : '이동 끔: 끌면 화면이 돌아갑니다.'); }
$('#bRead').onclick = () => setView('read');
$('#bExp').onclick = () => setView('exp');
$('#bPan').onclick = () => setPan(!panMode);
controls.addEventListener('start', () => { if (viewMode === 'read') { viewMode = 'over'; syncViewBtns(); } camTween = null; });
canvas.addEventListener('dblclick', e => { cast(e); if (ray.intersectObject(leftPage, false).length) setView('read', true); else if (ray.intersectObjects([hoverBox, rightPage], false).length) setView('exp', true); });
$('#bPrev').onclick = () => go(IDS[IDS.indexOf(curId) - 1], -1);
$('#bNext').onclick = () => go(IDS[IDS.indexOf(curId) + 1], 1);

let tour = { on: false, i: -1, t: 0 };
function updateBar() {
  const c = CHAP[curId]; $('#capNo').textContent = c.no;
  $('#capTx').textContent = tour.i >= 0 ? cur.tour[tour.i].cap : c.title;
  $('#steps').innerHTML = cur.tour.map((s, i) => `<button class="${i === tour.i ? 'on' : ''}" data-step="${i}" aria-label="장면 ${i + 1}"></button>`).join('');
  $('#playIco').innerHTML = tour.on ? '<path d="M8 5v14M16 5v14" style="stroke-width:3"/>' : '<path d="M8 5l11 7-11 7z" style="fill:var(--ink);stroke:none"/>';
  $('#bPlay').setAttribute('aria-label', tour.on ? '장면 멈추기' : '장면 따라가기');
  $('#bPrev').disabled = IDS.indexOf(curId) === 0; $('#bNext').disabled = IDS.indexOf(curId) === IDS.length - 1;
  $('#bPrev').style.opacity = $('#bPrev').disabled ? .35 : 1; $('#bNext').style.opacity = $('#bNext').disabled ? .35 : 1;
}
function setStep(i) { tour.i = i; tour.t = 0; const s = cur.tour[i]; if (s.act) s.act(); flyTo(s.cam); updateBar(); announce(s.cap); }
function stopTour() { tour = { on: false, i: -1, t: 0 }; }
$('#steps').onclick = e => { const b = e.target.closest('[data-step]'); if (b) { tour.on = false; setStep(+b.dataset.step); } };
$('#bPlay').onclick = () => { if (tour.on) { tour.on = false; updateBar(); return; } tour.on = true; setStep(tour.i < 0 || tour.i >= cur.tour.length - 1 ? 0 : tour.i + 1); };

let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2600); }
function announce(extra) { const c = CHAP[curId]; $('#sr').textContent = extra || `${c.no}장 ${c.title}. ${c.intro} 예측: ${c.q} ${c.opts.map((o, i) => `${i + 1}번 ${o}`).join(', ')}`; }

/* ---------- 포인터 ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
function cast(e) { const r = canvas.getBoundingClientRect(); ndc.set((e.clientX - r.left) / r.width * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(ndc, camera); }
function pageHit(e) { cast(e); const h = ray.intersectObjects([leftPage, rightPage], false)[0]; if (!h || !h.uv) return null;
  const x = h.uv.x * PCW, y = (1 - h.uv.y) * PCH, list = h.object === leftPage ? hot.left : hot.right;
  return list.find(s => x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) || null; }
let down = null, dragging = false;
const inv = new THREE.Matrix4();
function dragPoint() { inv.copy(content.matrixWorld).invert(); const r = ray.ray.clone().applyMatrix4(inv); const p = new THREE.Vector3(); return r.intersectPlane(cur.plane, p) ? p : null; }
function overDrawing(e) { cast(e); return ray.intersectObjects([hoverBox, rightPage], false).length > 0; }
canvas.addEventListener('pointerleave', () => { hoverOn = false; });
canvas.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse') { const o = overDrawing(e); if (o) { touchHold = true; lastHover = performance.now(); } else { cast(e); if (ray.intersectObject(leftPage, false).length) touchHold = false; } }
  down = { x: e.clientX, y: e.clientY }; if (busy || !cur || !cur.dragTargets) return;
  cast(e); if (ray.intersectObjects(cur.dragTargets(), false).length) { dragging = true; controls.enabled = false; canvas.setPointerCapture(e.pointerId); tour.on = false; cur.dragStart(); updateBar(); }
}, { capture: true });
canvas.addEventListener('pointermove', e => {
  if (dragging) { cast(e); const p = dragPoint(); if (p) cur.dragMove(p); return; }
  if (e.pointerType === 'mouse' && !busy) { hoverOn = overDrawing(e); if (hoverOn) lastHover = performance.now(); }
  if (e.buttons || busy || !cur) return;
  const hs = pageHit(e); let over = !!hs;
  if (!over && cur.dragTargets) over = ray.intersectObjects(cur.dragTargets(), false).length > 0;
  if (!over && cur.clickTargets) over = ray.intersectObjects(cur.clickTargets(), false).length > 0;
  canvas.style.cursor = over ? 'pointer' : 'grab';
});
canvas.addEventListener('pointerup', e => {
  if (dragging) { dragging = false; controls.enabled = true; cur.dragEnd(); return; }
  if (!down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 6 || busy || !cur) return;
  const hs = pageHit(e); if (hs) { hs.act(); if (!$('#flap').hidden || hs.act === openFlap) {} redraw(); return; }
  if (cur.clickTargets) { cast(e); if (ray.intersectObjects(cur.clickTargets(), false).length) cur.click(); }
});
addEventListener('keydown', e => { if (e.target.closest('input')) return;
  if (e.key === 'ArrowRight') $('#bNext').click(); else if (e.key === 'ArrowLeft') $('#bPrev').click();
  else if (/^[1-4]$/.test(e.key) && curId) { pick(+e.key - 1); }
  else if (e.key === 'Escape') closePanels(); else if (e.key === 'r' || e.key === 'R') setView('read'); else if (e.key === 'e' || e.key === 'E') setView('exp'); });

/* ---------- 크기와 반복 ---------- */
function resize() { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); lineMats.forEach(m => m.resolution.set(innerWidth, innerHeight)); }
addEventListener('resize', resize); resize();
let last = performance.now(), calcT = 0, lastCalc = '';
function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  for (let i = tweens.length - 1; i >= 0; i--) { const w = tweens[i]; w.t = Math.min(1, w.t + dt / w.d); w.fn(w.t); if (w.t >= 1) { tweens.splice(i, 1); w.res(); } }
  if (camTween) { const k = camTween; k.t = Math.min(1, k.t + dt / k.d); const e = ease(k.t); camera.position.lerpVectors(k.p0, k.p1, e); controls.target.lerpVectors(k.t0, k.t1, e); if (k.t >= 1) camTween = null; }
  const nowT = performance.now(), step = tour.on && tour.i >= 0 && cur ? cur.tour[tour.i] : null;
  const want = !forceFlat && (dragging || touchHold || hoverOn || viewMode === 'exp' || nowT - lastHover < 650 || (step && step.cam !== 'read'));
  popK = reduce ? (want ? 1 : 0) : clamp(popK + (want ? dt / .8 : -dt / .55), 0, 1);
  popE = ease(popK);
  hinge.rotation.x = -PI / 2 * (1 - popE) - (want && popK < 1 ? Math.sin(PI * popK) * .06 : 0);
  flat.scale.z = .02 + .98 * popE; flat.position.z = (1 - popE) * (2.15 * flat.scale.z + .004);
  if (cur) { cur.update(dt);
    const showS = popE > .9; content.traverse(o => { if (o.isSprite) { if (!o.userData.managed) o.visible = showS; else if (!showS) o.visible = false; } });
    calcT += dt; if (calcT > .15) { calcT = 0; const s = cur.calc().join('|'); if (s !== lastCalc) { lastCalc = s; drawCalc(); } renderHud(); }
    if (tour.on && tour.i >= 0) { tour.t += dt; if (tour.t > 6) { if (tour.i < cur.tour.length - 1) setStep(tour.i + 1); else { tour.on = false; updateBar(); } } } }
  controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop);
}

/* ---------- 시작 ---------- */
async function start() {
  const all = JSON.stringify(CHAP) + $('#teach').textContent + Object.values(BUILD).map(f => f.toString()).join('') + '0123456789.%·→×½²₀₁₂₃ⁿ⁰−+=÷√()…?↑↓℃°';
  if (document.fonts && document.fonts.load) {
    try { await Promise.race([Promise.all([document.fonts.load(`40px "Gowun Batang"`, all), document.fonts.load(`700 40px "Gowun Batang"`, all), document.fonts.load(`40px "Nanum Pen Script"`, all)]), new Promise(r => setTimeout(r, 4000))]); } catch (e) {}
    document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', () => { if (cur) { redraw(); } });
  }
  const id = IDS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'ch1';
  const o = CAM.over(); camera.position.set(o[0][0], o[0][1] + 1.5, o[0][2] + 1.5); controls.target.set(...o[1]);
  build(id); redraw(); updateMenu(); announce();
  $('#loading').style.opacity = 0; setTimeout(() => $('#loading').remove(), 700);
  flyTo('over');
  requestAnimationFrame(loop);
  setTimeout(() => toast(matchMedia('(hover: hover)').matches ? '오른쪽 그림에 마우스를 올리면 그림이 일어섭니다.' : '오른쪽 그림을 누르면 그림이 일어섭니다.'), 1200);
}
start();
})();
